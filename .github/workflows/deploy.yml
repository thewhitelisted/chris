name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Rename devlogs folders of repos renamed on GitHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: npm run sync-renames
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_REPOS_TOKEN: ${{ secrets.PORTFOLIO_REPOS_TOKEN }}
      - name: Commit devlogs folder renames
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          git add -A ../devlogs
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Rename devlogs folders of repos renamed on GitHub'
          git push origin HEAD:master
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_REPOS_TOKEN: ${{ github.event_name != 'pull_request' && secrets.PORTFOLIO_REPOS_TOKEN || '' }}
          ALLOW_NO_GITHUB_PROJECTS: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: code/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
