name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The only job that can push. It installs without scripts and runs nothing but the rename sync, so no other
  # dependency, test or build step ever holds a write token.
  sync-renames:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Rename devlogs folders of repos renamed on GitHub
        run: npm run sync-renames
        env:
          PORTFOLIO_REPOS_TOKEN: ${{ secrets.PORTFOLIO_REPOS_TOKEN }}
      - name: Commit devlogs folder renames
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add -A ../devlogs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Rename devlogs folders of repos renamed on GitHub'
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync-renames
    if: ${{ !cancelled() && (needs.sync-renames.result == 'success' || needs.sync-renames.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync-renames.outputs.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_REPOS_TOKEN: ${{ github.event_name != 'pull_request' && secrets.PORTFOLIO_REPOS_TOKEN || '' }}
          ALLOW_NO_GITHUB_PROJECTS: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: code/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
